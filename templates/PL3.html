<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Optimization Setup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .section {
            margin-bottom: 20px;
            display: none;
        }

        .active {
            display: block !important;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table,
        th,
        td {
            border: 1px solid #ddd;
            text-align: center;
        }

        th,
        td {
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .navigation {
            margin-top: 20px;
            text-align: center;
        }

        .navigation button {
            margin: 0 5px;
        }
    </style>
</head>

<body>
    <h1>Inventory Optimization Setup</h1>

    <form id="inventoryForm">
        <!-- Step 1: Number of Periods and Products -->
        <div id="step1" class="section active">
            <div>
                <label for="periods">Number of Periods:</label>
                <input type="number" id="periods" name="periods" min="1" required>
            </div>

            <div>
                <label for="products">Number of Products:</label>
                <input type="number" id="products" name="products" min="1" required>
            </div>

            <div class="navigation">
                <button type="button" onclick="nextStep(1)">Next</button>
            </div>
        </div>

        <!-- Step 2: Product Information -->
        <div id="step2" class="section">
            <h2>Product Information</h2>
            <table id="productTable">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Holding Cost</th>
                        <th>Ordering Cost</th>
                        <th>Setup Cost</th>
                        <th>Capacity</th>
                        <th>Expiration (unit = number of periods)</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
            <button type="button" onclick="addProductRow()">Add Product</button>

            <div class="navigation">
                <button type="button" onclick="previousStep(2)">Previous</button>
                <button type="button" onclick="nextStep(2)">Next</button>
            </div>
        </div>

        <!-- Step 3: Demands -->
        <div id="step3" class="section">
            <h2>Demands</h2>
            <table id="demandTable">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Period</th>
                        <th>Demand</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
            <button type="button" onclick="addDemandRow()">Add Demand</button>

            <div class="navigation">
                <button type="button" onclick="previousStep(3)">Previous</button>
                <button type="button" onclick="nextStep(3)">Next</button>
            </div>
        </div>

        <!-- Step 4: Shared Capacity -->
        <div id="step4" class="section">
            <label for="sharedCapacity">Shared Capacity (Optional):</label>
            <input type="number" id="sharedCapacity" name="sharedCapacity" min="0">

            <div class="navigation">
                <button type="button" onclick="previousStep(4)">Previous</button>
                <button type="submit">Submit</button>
            </div>
        </div>

    </form>

    <script>
        let products = [];
        let periods = 0;

        // Function to move to the next step
        function nextStep(currentStep) {
            const current = document.getElementById('step' + currentStep);
            const next = document.getElementById('step' + (currentStep + 1));

            current.classList.remove('active');
            next.classList.add('active');
        }

        // Function to move to the previous step
        function previousStep(currentStep) {
            const current = document.getElementById('step' + currentStep);
            const previous = document.getElementById('step' + (currentStep - 1));

            current.classList.remove('active');
            previous.classList.add('active');
        }

        // Add a product row in the table
        function addProductRow() {
            const table = document.getElementById('productTable').getElementsByTagName('tbody')[0];
            const row = table.insertRow();
            row.innerHTML = `
                <td><input type="text" name="productNames[]" required></td>
                <td><input type="number" name="holdingCosts[]" step="0.01" required></td>
                <td><input type="number" name="orderingCosts[]" step="0.01" required></td>
                <td><input type="number" name="setupCosts[]" step="0.01" required></td>
                <td><input type="number" name="capacities[]" min="1" required></td>
                <td><input type="number" name="expirationPeriods[]" min="1" required></td>
            `;
        }

        // Add demand rows for each product in Step 3
        function addDemandRow() {
            const table = document.getElementById('demandTable').getElementsByTagName('tbody')[0];
            const productSelect = document.createElement('select');
            products.forEach((product, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = product.name;
                productSelect.appendChild(option);
            });

            for (let i = 1; i <= periods; i++) {
                const row = table.insertRow();
                row.innerHTML = `
                    <td>${productSelect.outerHTML}</td>
                    <td>${i}</td>
                    <td><input type="number" name="demands[]" min="0" required></td>
                `;
            }
        }

        // Handle form submission and send data to Flask backend
        document.getElementById('inventoryForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const formData = new FormData(event.target);
            const periods = parseInt(formData.get('periods'));
            const products = parseInt(formData.get('products'));

            const period_names = Array.from(formData.getAll('period_names[]'));
            const product_names = Array.from(formData.getAll('productNames[]'));

            // Create a dictionary for demands using the (product, period) tuple as the key
            const demands = {};
            formData.getAll('demands[]').forEach((d, index) => {
                const productIndex = index % products;  // Find the correct product index
                const periodIndex = Math.floor(index / products);  // Find the correct period index
                const key = `${product_names[productIndex]}-${period_names[periodIndex]}`;  // Create a key using product and period
                demands[key] = parseInt(d);
            });

            // Similarly, create dictionaries for holding_costs, ordering_costs, etc.
            const holding_costs = {};
            formData.getAll('holdingCosts[]').forEach((h, index) => {
                const productIndex = index % products;
                const key = product_names[productIndex];
                holding_costs[key] = parseFloat(h);
            });

            const ordering_costs = {};
            formData.getAll('orderingCosts[]').forEach((o, index) => {
                const productIndex = index % products;
                const key = product_names[productIndex];
                ordering_costs[key] = parseFloat(o);
            });

            const setup_costs = {};
            formData.getAll('setupCosts[]').forEach((s, index) => {
                const productIndex = index % products;
                const key = product_names[productIndex];
                setup_costs[key] = parseFloat(s);
            });

            const expiration_periods = {};
            formData.getAll('expirationPeriods[]').forEach((e, index) => {
                const productIndex = index % products;
                const key = product_names[productIndex];
                expiration_periods[key] = parseInt(e);
            });

            const capacities = {};
            formData.getAll('capacities[]').forEach((c, index) => {
                const productIndex = index % products;
                const key = product_names[productIndex];
                capacities[key] = parseInt(c);
            });

            const shared_capacity = formData.get('sharedCapacity') ? parseInt(formData.get('sharedCapacity')) : null;

            const data = {
                periods,
                products,
                period_names,
                product_names,
                demands,
                holding_costs,
                ordering_costs,
                setup_costs,
                expiration_periods,
                capacities,
                shared_capacity,
            };

            fetch('/PL3', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
                .then(response => response.json())
                .then(response => {
                    if (response.status === 'success') {
                        console.log(response);
                        alert('Data submitted successfully');
                    } else {
                        alert('Error: ' + response.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error occurred while submitting the form.');
                });
        });


        // Initialize products and periods after Step 1
        document.getElementById('periods').addEventListener('change', (e) => {
            periods = e.target.value;
        });

        document.getElementById('products').addEventListener('change', (e) => {
            const productCount = e.target.value;
            products = [];
            for (let i = 0; i < productCount; i++) {
                products.push({ name: `Product ${i + 1}` });
            }
            // Update Step 3 with default products and periods
            if (products.length && periods) {
                addDemandRow();
            }
        });

    </script>
</body>

</html>
