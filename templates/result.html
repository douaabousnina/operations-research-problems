<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Graph Coloring Result</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .property-section { background: #f4f4f4; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        input { margin: 5px 0; width: 100%; padding: 5px; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Graph Coloring Result</h1>
        <p>Number of colors used: <strong>{{ num_colors }}</strong></p>
        <table>
            <tr>
                <th>Vertex</th>
                <th>Color</th>
            </tr>
            <div class="graphdiv">
                <img src="{{ url_for('static', filename='/test.png') }}" alt="Graph" class="graph">
            </div>
            {% for vertex, color in solution.items() %}
            <tr>
                <td>{{ vertex }}</td>
                <td>{{ color }}</td>
            </tr>
            {% endfor %}

        </table>
        <a href="{{ url_for('index2') }}" class="button">Solve Another Graph</a>
    </div>
</body>
</html>
