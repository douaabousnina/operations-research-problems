<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Graph Coloring Result</title>
</head>

<body>
    <button id="gg" onclick="window.location.href = '/'">Acceuil</button>
    <div class="flex-container">
        <div class="container">
            <h1>Graph Coloring Result</h1>
            <p>Number of colors used: <strong>{{ num_colors }}</strong></p>
            <table>
                <tr>
                    <th>Vertex</th>
                    <th>Color</th>
                </tr>
                <div class="graphdiv">
                    <img src="{{ url_for('static', filename='/test.png') }}" alt="Graph" class="graph">
                </div>
                {% for vertex, color in solution.items() %}
                <tr>
                    <td>{{ vertex }}</td>
                    <td>{{ color }}</td>
                </tr>
                {% endfor %}

            </table>
            <a href="{{ url_for('index2') }}" class="button">Solve Another Graph</a>
        </div>
    </div>
</body>

</html>
