<!DOCTYPE html>
<html>
<head>
    <title>PL1 Setup</title>
</head>
<body>
    <h1>Blending Problem Setup</h1>
    <form method="POST">
        <label>Number of Ingredients:</label>
        <input type="number" name="num_ingredients" required><br>
        <label>Number of Properties:</label>
        <input type="number" name="num_properties" required><br>
        <label>Total Quantity:</label>
        <input type="number" step="any" name="total_quantity" required><br>
        <button type="submit">Next</button>
    </form>
</body>
</html>
