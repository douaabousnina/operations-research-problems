<!DOCTYPE html>
<html>
<head>
    <title>Blending Problem Solver</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-container { background: #f4f4f4; padding: 20px; border-radius: 5px; }
        input { margin: 10px 0; width: 100%; padding: 5px; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Blending Problem Solver</h1>
    <div class="form-container">
        <form method="post">
            <label>Number of Ingredients:</label>
            <input type="number" name="num_ingredients" min="1" required><br>
            
            <label>Number of Properties:</label>
            <input type="number" name="num_properties" min="1" required><br>
            
            <label>Total Product Quantity:</label>
            <input type="number" step="any" name="total_quantity" min="0" required><br>
            
            <button type="submit">Next</button>
        </form>
    </div>
</body>
</html>
