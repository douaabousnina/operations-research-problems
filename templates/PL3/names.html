<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Optimization - Product Names</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <button id="gg" onclick="window.location.href = '/'">Home</button>
    <div class="flex-container">
        <div class="container">
            <h1>Step 2: Enter Product Names</h1>
            <form method="POST">
                {% for i in range(1, products + 1) %}
                <div class="form-group">
                    <label for="product_name_{{ i }}">Product {{ i }} Name:</label>
                    <input type="text" id="product_name_{{ i }}" name="product_name_{{ i }}" required>
                </div>
                {% endfor %}
                <button type="submit">Next</button>
            </form>
        </div>
    </div>
</body>

</html>
