<!DOCTYPE html>
<html>
<head>
    <title>Input Ingredients</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .ingredient-section { background: #f4f4f4; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        input { margin: 5px 0; width: 100%; padding: 5px; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Input Ingredient Details</h1>
    <form method="post">
        {% for i in range(num_ingredients) %}
            <div class="ingredient-section">
                <h3>Ingredient {{ i + 1 }}</h3>
                <label>Ingredient Name:</label>
                <input type="text" name="ingredient_name_{{ i }}" required><br>
                
                <label>Cost per Unit:</label>
                <input type="number" step="any" name="cost_per_unit_{{ i }}" min="0" required><br>
                
                <label>Available Quantity:</label>
                <input type="number" step="any" name="available_quantity_{{ i }}" min="0" required><br>
            </div>
        {% endfor %}
        
        <button type="submit">Next</button>
    </form>
</body>
</html>
