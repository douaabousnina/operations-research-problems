<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimization Results</title>
</head>

<body>
    <h1>Optimization Results</h1>

    <h3>Order Quantities</h3>
    <ul>
        {% for quantity in order_quantities %}
        <li>{{ quantity }}</li>
        {% endfor %}
    </ul>

    <h3>Inventory Levels</h3>
    <ul>
        {% for level in inventory_levels %}
        <li>{{ level }}</li>
        {% endfor %}
    </ul>

    <h3>Total Cost: {{ total_cost }}</h3>

    <a href="/PL3">Go back to the form</a>
</body>

</html>
