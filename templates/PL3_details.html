{# templates/PL3_details.html #}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Optimization - Input Details</title>
    <style>
        .error { color: red; margin: 10px 0; }
        .form-group { margin-bottom: 15px; }
        .product-section { 
            border: 1px solid #ccc; 
            padding: 15px; 
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .demand-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; }
        input[type="number"] { 
            width: 150px; 
            padding: 5px;
            margin-bottom: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h1>Step 3: Provide Input Details</h1>
    
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" onsubmit="return validateForm()">
        {% for p in range(products) %}
        <div class="product-section">
            <h2>{{ product_names[p] }}</h2>
            
            <h3>Demands</h3>
            <div class="demand-grid">
                {% for t in range(periods) %}
                <div class="form-group">
                    <label for="demand_{{ p }}_{{ t }}">Period {{ t + 1 }}:</label>
                    <input type="number" 
                           id="demand_{{ p }}_{{ t }}" 
                           name="demand_{{ p }}_{{ t }}" 
                           step="any"
                           required>
                </div>
                {% endfor %}
            </div>

            <div class="form-group">
                <label for="holding_cost_{{ p }}">Holding Cost:</label>
                <input type="number" 
                       id="holding_cost_{{ p }}" 
                       name="holding_cost_{{ p }}" 
                       step="any"
                       required>
            </div>

            <div class="form-group">
                <label for="ordering_cost_{{ p }}">Ordering Cost:</label>
                <input type="number" 
                       id="ordering_cost_{{ p }}" 
                       name="ordering_cost_{{ p }}" 
                       step="any"
                       required>
            </div>

            <div class="form-group">
                <label for="setup_cost_{{ p }}">Setup Cost:</label>
                <input type="number" 
                       id="setup_cost_{{ p }}" 
                       name="setup_cost_{{ p }}" 
                       step="any"
                       required>
            </div>

            <div class="form-group">
                <label for="capacity_{{ p }}">Capacity:</label>
                <input type="number" 
                       id="capacity_{{ p }}" 
                       name="capacity_{{ p }}" 
                       step="any"
                       required>
            </div>

            <div class="form-group">
                <label for="expiration_{{ p }}">Expiration Period (in days):</label>
                <input type="number" 
                       id="expiration_{{ p }}" 
                       name="expiration_{{ p }}" 
                       min="1"
                       required>
            </div>
        </div>
        {% endfor %}

        <div class="form-group">
            <label for="shared_capacity">Shared Capacity (Optional):</label>
            <input type="number" 
                   id="shared_capacity" 
                   name="shared_capacity" 
                   step="any">
        </div>

        <button type="submit">Optimize</button>
    </form>

    <script>
        function validateForm() {
            const inputs = document.querySelectorAll('input[type="number"]');
            for (let input of inputs) {
                if (input.hasAttribute('required') && !input.value) {
                    alert('Please fill in all required fields.');
                    input.focus();
                    return false;
                }
                if (input.value && input.value < 0) {
                    alert('All values must be non-negative.');
                    input.focus();
                    return false;
                }
            }
            return true;
        }
    </script>
</body>
</html>
