<!DOCTYPE html>
<html>
<head>
    <title>Property Bounds</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .property-section { background: #f4f4f4; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        input { margin: 5px 0; width: 100%; padding: 5px; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Set Property Bounds for Final Product</h1>
    <form method="post">
        <div class="property-section">
            <p>Total Quantity: {{ total_quantity }}</p>
            {% for prop in properties %}
                <h3>{{ prop }} Bounds</h3>
                <label>Minimum (total quantity multiplier):</label>
                <input type="number" step="any" min="0" max="1" name="{{ prop }}_min" required><br>
                
                <label>Maximum (total quantity multiplier):</label>
                <input type="number" step="any" min="0" max="1" name="{{ prop }}_max" required><br>
            {% endfor %}
        
            <button type="submit">Solve Blending Problem</button>
        </div>
    </form>
</body>
</html>
