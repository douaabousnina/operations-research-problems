<!DOCTYPE html>
<html>
<head>
    <title>Input Properties</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .property-section { background: #f4f4f4; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        input { margin: 5px 0; width: 100%; padding: 5px; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Input Property Details for Ingredients</h1>
    <form method="POST">
        {% for i, ingredient in enumerate(ingredients) %}
            <h3>{{ ingredient.name }}</h3>
            {% for j, property_name in enumerate(property_names) %}
                <label for="ingredient_{{ i }}_property_{{ j }}">{{ property_name }}:</label>
                <input type="number" step="any" id="ingredient_{{ i }}_property_{{ j }}" name="ingredient_{{ i }}_property_{{ j }}" required>
                <br>
            {% endfor %}
        {% endfor %}
        <button type="submit">Next</button>
    </form>
</body>
</html>
