<!DOCTYPE html>
<html>
<head>
    <title>Input Properties</title>
    <link rel="stylesheet" href="static/style2.css">
</head>
<body>
    <button id="gg" onclick="navigateTo('/')">Acceuil</button>
    <div class="container">
    <h1>Input Property Details for Ingredients</h1>
    
    <form method="POST">
        {% for i, ingredient in enumerate(ingredients) %}
            <h3>{{ ingredient.name }}</h3>
            {% for j, property_name in enumerate(property_names) %}
                <label for="ingredient_{{ i }}_property_{{ j }}">{{ property_name }}:</label>
                <input type="number" step="any" id="ingredient_{{ i }}_property_{{ j }}" name="ingredient_{{ i }}_property_{{ j }}" required>
                <br>
            {% endfor %}
        {% endfor %}
        <div class="form-group" style="display: flex;justify-content: center;gap: 0px;">
           
            <button onclick="navigateTo('/property_naming')">Previous</button>
            <button type="submit">Next</button> 
        </div>
    </form>
</div>
</body>
<script>
    function navigateTo(url) {
        window.location.href = url;
    }
</script>
</html>
